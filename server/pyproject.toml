[project]
name = "planarally-server"
version = "2026.2.0"
description = "Planarally server"
readme = "README.md"
requires-python = ">=3.13.2"

dependencies = [
    "aiohttp[speedups]==3.14.4",
    "aiohttp-security==0.5.0",
    "aiohttp-session==2.12.1",
    "bcrypt==5.0.0",
    "cryptography==50.0.2",
    "peewee==3.19.0",
    "pillow==12.3.0",
    "pydantic[email]==2.13.5",
    "python-engineio==4.14.0",
    "python-socketio==5.17.0",
    "redmail==0.6.0",
    "rtoml==0.13.0",
    "typing-extensions==4.16.0",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = ["pydantic-to-typescript==2.0.0", "ruff==0.16.10"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001", "E722"]

[tool.ruff.lint.per-file-ignores]
"src/api/models/*" = ["F403"]
