[project]
name = "planarally-server"
version = "2026.2.0"
description = "Planarally server"
readme = "README.md"
requires-python = ">=3.13.2"

dependencies = [
    "aiohttp[speedups]==3.14.5",
    "aiohttp-security==0.5.0",
    "aiohttp-session==2.12.1",
    "bcrypt==5.0.0",
    "cryptography==50.0.2",
    "peewee==3.19.0",
    "pillow==13.0.0",
    "pydantic[email]==2.14.1",
    "python-engineio==4.15.0",
    "python-socketio==5.17.0",
    "redmail==0.6.0",
    "rtoml==0.14.0",
    "typing-extensions==4.16.0",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = ["pydantic-to-typescript==2.0.0", "ruff==0.17.3"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["BLE001", "E722"]

[tool.ruff.lint.per-file-ignores]
"src/api/models/*" = ["F403"]
